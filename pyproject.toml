[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaper-mcp-server"
version = "0.2.0"
description = "MCP server for controlling REAPER DAW with AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Youssef Hemimy", email = "itsuzef@users.noreply.github.com" },
]
keywords = ["mcp", "reaper", "daw", "audio", "music", "midi", "mastering", "mixing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "mcp>=2.0.0,<3",
    "python-reapy>=0.10.0",
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/bonfire-systems/reaper-mcp"
Repository = "https://github.com/bonfire-systems/reaper-mcp"
Issues = "https://github.com/bonfire-systems/reaper-mcp/issues"

[project.scripts]
reaper-mcp-server = "reaper_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit, so the rules do not change with ruff's defaults between versions.
# PLR0917 is a preview rule; explicit-preview-rules enables only it.
preview = true
explicit-preview-rules = true
select = [
    "E4", "E7", "E9", "F",  # pyflakes and pycodestyle errors
    "I",                    # import order
    "B",                    # bugbear
    "PLR0913", "PLR0917",   # argument counts (tool parameters are keyword-only)
    "RUF100", "PGH004",     # no stale or blanket noqa
]
# Only a bare `_` is a dummy: otherwise `_a, _b, ...` would dodge the counts.
dummy-variable-rgx = "^_$"

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 3

[tool.ruff.lint.per-file-ignores]
# pytest injects fixtures by name; a test is not a positional call site.
"tests/**" = ["PLR0913", "PLR0917"]
